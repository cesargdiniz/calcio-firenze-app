# Uma vez: grava a temporada de lançamento (times e elencos fictícios, dois
# turnos sorteados) nas três categorias. Substitui times, pessoas, partidas,
# pagamentos e decisões; não toca em usuários, Organização, parâmetros,
# drafts e sorteios. O log mostra só contagens.
name: Semear temporada de lançamento

on:
  push:
    branches: [claude/semear]

jobs:
  semear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Gera a semente
        env:
          TZ: America/Sao_Paulo
          SAIDA: ${{ runner.temp }}/semente.json
        run: flutter test tool/semear_test.dart
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Grava no Firestore
        env:
          CONTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SEMENTE: ${{ runner.temp }}/semente.json
        run: |
          printf '%s' "$CONTA" > "$RUNNER_TEMP/c.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/c.json"
          trap 'rm -f "$RUNNER_TEMP/c.json"' EXIT
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i firebase-admin@13 --no-audit --no-fund >/dev/null
          node -e '
          const fs=require("fs");
          const {initializeApp}=require("firebase-admin/app");
          const {getFirestore,Timestamp}=require("firebase-admin/firestore");
          initializeApp(); const db=getFirestore();
          const conv=(v)=>Array.isArray(v)?v.map(conv):(v&&typeof v==="object")?(("__ts" in v)?Timestamp.fromMillis(v.__ts):Object.fromEntries(Object.entries(v).map(([k,x])=>[k,conv(x)]))):v;
          const semente=JSON.parse(fs.readFileSync(process.env.SEMENTE,"utf8"));
          (async()=>{
            for (const [temp,dados] of Object.entries(semente)) {
              const ref=db.collection("temporadas").doc(temp);
              for (const col of ["times","pessoas","partidas","pagamentos","decisoes"]) {
                const docs=(await ref.collection(col).get()).docs;
                for (let i=0;i<docs.length;i+=400){const b=db.batch();docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit();}
                const novos=Object.entries(dados[col]||{});
                for (let i=0;i<novos.length;i+=400){const b=db.batch();novos.slice(i,i+400).forEach(([id,m])=>b.set(ref.collection(col).doc(id),conv(m)));await b.commit();}
                console.log(temp,col,"apagados:",docs.length,"gravados:",novos.length);
              }
            }
          })().catch(e=>{console.error(e.message);process.exit(1);});'
