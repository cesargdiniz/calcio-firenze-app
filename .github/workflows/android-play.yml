# Android: gera o App Bundle assinado e envia ao Google Play (teste interno).
#
# Roda no ubuntu (já tem o SDK do Android e cobra 1x, contra 10x do macOS).
# Dispara com a mesma tag `v*` do iPhone, ou à mão em Actions.
#
# Segredos (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64      chave de upload (.jks) em base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON    conta de serviço com acesso ao Play Console
#
# O primeiro envio de um app novo tem de ser feito à mão no Play Console:
# baixe o .aab do artefato "aab" desta execução (use "so_compilar").

name: Android - Google Play

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      so_compilar:
        description: 'Só gerar o .aab assinado, sem enviar ao Play (para o primeiro envio manual)'
        type: boolean
        default: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PACKAGE_NAME: br.com.calciofirenze.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Barreiras antes de compilar: segundos que mantêm um build quebrado fora da loja.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Grava a chave e o key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_BASE64"; exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          # A chave fica fora do repositório: nenhum passo seguinte a grava ou envia.
          cat > android/key.properties <<PROPS
          storeFile=$KEYSTORE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # O número do build vem do contador de execuções: só sobe.
      - name: Gera o App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Guarda o App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Envia ao Google Play
        if: ${{ !inputs.so_compilar }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          # "draft" enquanto o app nunca foi publicado; depois da primeira
          # publicação, trocar para "completed".
          status: draft
