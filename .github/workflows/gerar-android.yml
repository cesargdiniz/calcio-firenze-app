# Gera a pasta android/ com o Flutter do CI e grava no próprio branch
# (uma vez só; depois a pasta é editada como o resto do código).
name: Gerar pasta Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Gera android/
        run: flutter create . --platforms android --org br.com.calciofirenze --project-name calcio_firenze
      - name: Grava no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "Pasta android/ gerada pelo flutter create"
          git push
