name: Galeria de telas

# Gera uma imagem de cada tela com os dados de exemplo e publica no branch
# galeria-telas-capturas. Rode à mão em Actions → Galeria de telas.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturar:
    name: Capturar telas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/galeria/galeria_telas.dart --update-goldens
      - name: Publicar as capturas no branch galeria-telas-capturas
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/capturas
          cp test/galeria/telas/*.png /tmp/capturas/ 2>/dev/null || true
          cd /tmp/capturas
          ls | wc -l
          git init -q -b galeria-telas-capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "Capturas das telas (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" galeria-telas-capturas
