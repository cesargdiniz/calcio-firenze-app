name: Galeria de telas

# Gera uma imagem de cada tela com os dados de exemplo e publica no branch
# galeria-telas-capturas. Rode à mão em Actions → Galeria de telas.
on:
  workflow_dispatch:
    inputs:
      loja:
        description: 'Capturas no tamanho da App Store (iPhone com Dynamic Island, tela média: 1206 x 2622)'
        type: boolean
        default: false
      computador:
        description: 'Capturas no layout de computador do site (1440 x 900), no branch galeria-computador'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  capturar:
    name: Capturar telas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capturar no layout de computador
        if: ${{ inputs.computador == true }}
        run: >
          flutter test test/galeria/galeria_telas.dart --update-goldens
          --dart-define=TELA_COMPUTADOR=true --dart-define=TELA_LARGURA=1440
          --dart-define=TELA_ALTURA=900 --dart-define=TELA_DENSIDADE=1
      - name: Capturar no tamanho padrão
        if: ${{ inputs.loja != true && inputs.computador != true }}
        run: flutter test test/galeria/galeria_telas.dart --update-goldens
      - name: Capturar no tamanho da App Store
        if: ${{ inputs.loja == true }}
        run: >
          flutter test test/galeria/galeria_telas.dart --update-goldens
          --dart-define=TELA_LARGURA=402 --dart-define=TELA_ALTURA=874
          --dart-define=TELA_DENSIDADE=3
      - name: Publicar as capturas no branch galeria-telas-capturas
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/capturas
          cp test/galeria/telas/* /tmp/capturas/ 2>/dev/null || true
          cd /tmp/capturas
          ls | wc -l
          git init -q -b galeria-telas-capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "Capturas das telas (${GITHUB_SHA::7})"
          RAMO=galeria-telas-capturas
          if [ "${{ inputs.computador }}" = "true" ]; then RAMO=galeria-computador; fi
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:$RAMO
