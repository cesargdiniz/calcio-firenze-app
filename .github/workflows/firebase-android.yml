# Uma vez só: registra o app Android no Firebase e grava a configuração
# pública (appId, apiKey) no branch, para entrar no firebase_options.dart.
name: Registrar Android no Firebase

on:
  push:
    branches: [claude/android]
    paths: [.github/workflows/firebase-android.yml]

permissions:
  contents: write

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registra e lê a configuração
        env:
          CONTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -uo pipefail
          printf '%s' "$CONTA" > "$RUNNER_TEMP/conta.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/conta.json"
          F="npx -y firebase-tools@latest --project calcio-firenze --non-interactive"
          mkdir -p firebase/android
          { $F apps:list ANDROID; } > firebase/android/log.txt 2>&1 || true
          if ! grep -q "br.com.calciofirenze.app" firebase/android/log.txt; then
            $F apps:create ANDROID "Calcio Firenze" --package-name br.com.calciofirenze.app >> firebase/android/log.txt 2>&1 || true
          fi
          ID=$($F apps:list ANDROID 2>/dev/null | grep "br.com.calciofirenze.app" | grep -o '1:[0-9]*:android:[0-9a-f]*' | head -1 || true)
          echo "appId: $ID" >> firebase/android/log.txt
          if [ -n "$ID" ]; then
            $F apps:sdkconfig ANDROID "$ID" > firebase/android/google-services.json 2>> firebase/android/log.txt || true
          fi
          sed -i '/private_key/d' firebase/android/log.txt
          rm -f "$RUNNER_TEMP/conta.json"
          cat firebase/android/log.txt
      - name: Grava no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase/android
          git commit -m "Configuração do Firebase para Android" || exit 0
          git push
