name: iPhone - conferir compilação (temporário)
on:
  push:
    branches: [claude/iphone]
    paths: [.github/workflows/ios-conferir.yml]
jobs:
  compilar:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version && xcodebuild -version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: git status --short | head -30
        if: always()
