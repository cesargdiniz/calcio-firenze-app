name: Gerar pasta do iPhone (temporário)
on:
  push:
    branches: [claude/iphone]
    paths: [.github/workflows/gerar-ios.yml]
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter --version
          flutter create . --platforms ios --org br.com.calciofirenze --project-name calcio_firenze
          rm -f test/widget_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          git status --short | head -80
          git commit -q -m "Pasta do iPhone gerada pelo Flutter"
          git push -q
