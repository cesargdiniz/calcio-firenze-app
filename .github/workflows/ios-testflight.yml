# Compila o app de iPhone e envia para o TestFlight.
#
# Só roda quando uma versão é marcada (tag v*) ou à mão. As máquinas Mac do
# GitHub gastam a cota gratuita dez vezes mais rápido que as Linux, então
# nunca a cada alteração.
#
# Nenhum segredo fica neste arquivo.
#
# Segredos (Settings → Secrets and variables → Actions → Secrets):
#   IOS_DIST_CERT_P12              certificado Apple Distribution (.p12), em base64
#   IOS_DIST_CERT_PASSWORD         senha usada ao exportar o .p12
#   IOS_PROVISION_PROFILE          perfil de provisionamento da App Store, em base64
#   APP_STORE_CONNECT_KEY_ID       id da chave da API do App Store Connect
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_PRIVATE_KEY  conteúdo inteiro do arquivo .p8
#
# O time (496DP4XG3F) e o nome do perfil ("Calcio Firenze App Store") ficam na
# configuração Release do alvo Runner, em ios/Runner.xcodeproj/project.pbxproj.

name: iPhone - TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      so_compilar:
        description: 'Só compilar, sem assinar nem enviar (para conferir o projeto)'
        type: boolean
        default: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      BUNDLE_ID: br.com.calciofirenze.app
      TEAM_ID: 496DP4XG3F
      PROFILE_NAME: Calcio Firenze App Store
      SO_COMPILAR: ${{ inputs.so_compilar == true }}

    steps:
      - uses: actions/checkout@v4

      # A App Store recusa envios feitos com Xcode antigo.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      # Barreiras antes de gastar tempo de Mac compilando.
      - name: Análise
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: Compilar sem assinar
        if: env.SO_COMPILAR == 'true'
        run: flutter build ios --release --no-codesign --build-number="${{ github.run_number }}"

      - name: Instalar certificado e perfil
        if: env.SO_COMPILAR != 'true'
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail

          # Chaveiro descartável: o certificado não toca o chaveiro padrão.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Sem isto, o codesign abre um pedido de autorização e a compilação
          # fica parada até estourar o tempo.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROFILE" | base64 --decode > "$PROFILES/build.mobileprovision"

      - name: Escrever ExportOptions.plist
        if: env.SO_COMPILAR != 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      # A assinatura manual fica na configuração Release do alvo Runner, e
      # não na linha de comando do xcodebuild: passada ali, valeria para
      # todos os alvos, inclusive os de dependências, que recusam o perfil.
      - name: Gerar o IPA
        if: env.SO_COMPILAR != 'true'
        run: |
          set -euo pipefail

          flutter build ios --release --no-codesign \
            --build-number="${{ github.run_number }}"

          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

          mv "$RUNNER_TEMP"/ipa/*.ipa "$RUNNER_TEMP/ipa/app.ipa"

      - name: Enviar para o TestFlight
        if: env.SO_COMPILAR != 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_FILE"

          # O envio às vezes falha por demora do servidor da Apple; três
          # tentativas espaçadas evitam perder uma compilação pronta.
          for tentativa in 1 2 3; do
            if xcrun altool --upload-app --type ios \
              --file "$RUNNER_TEMP/ipa/app.ipa" \
              --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"; then
              exit 0
            fi
            echo "envio falhou na tentativa $tentativa"
            if [ "$tentativa" -lt 3 ]; then sleep 60; fi
          done
          exit 1

      - name: Guardar o IPA
        if: always() && env.SO_COMPILAR != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: warn
